services:
  baby-a:
    build:
      context: ../..
      dockerfile: deploy/mode-r/Dockerfile
    command:
      - --transport=tcp
      - --bind=0.0.0.0
      - --port=4318
      - --track=${ALD_LEARNER_TRACK:-no-learning}
      - --host-label=baby-a
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    networks: [baby-a-only]

  baby-b:
    build:
      context: ../..
      dockerfile: deploy/mode-r/Dockerfile
    command:
      - --transport=tcp
      - --bind=0.0.0.0
      - --port=4318
      - --track=${ALD_LEARNER_TRACK:-no-learning}
      - --host-label=baby-b
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    networks: [baby-b-only]

  nursery:
    build:
      context: ../..
      dockerfile: deploy/mode-r/Dockerfile
    entrypoint: ["/usr/local/bin/node", "/app/deploy/mode-r/verify-isolation.mjs"]
    command: [both]
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    networks: [baby-a-only, baby-b-only]

networks:
  baby-a-only:
    internal: true
  baby-b-only:
    internal: true

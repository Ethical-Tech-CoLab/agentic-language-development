name: Consolidated integrity suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  consolidated-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run consolidated suite with timing
        run: |
          mkdir -p artifacts
          /usr/bin/time -v npm run check:ci 2> artifacts/consolidated-runtime.txt

      - name: Upload test and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-suite-evidence
          path: artifacts/
          retention-days: 30

  mode-r:
    runs-on: ubuntu-latest
    needs: consolidated-suite
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real-container Mode R suite with timing
        run: |
          mkdir -p artifacts
          /usr/bin/time -v npm run test:mode-r 2> artifacts/mode-r-runtime.txt

      - name: Upload Mode R runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mode-r-suite-evidence
          path: artifacts/
          retention-days: 30

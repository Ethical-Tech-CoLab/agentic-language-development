name: Research book integrity

on:
  pull_request:
    paths:
      - RESEARCH.md
      - research-book.html
      - book/**
      - scripts/build-research-book.mjs
      - scripts/research-book-entry.js
      - package.json
      - package-lock.json
      - vitest.config.ts
  push:
    branches:
      - main
    paths:
      - RESEARCH.md
      - research-book.html
      - book/**
      - scripts/build-research-book.mjs
      - scripts/research-book-entry.js
      - package.json
      - package-lock.json
      - vitest.config.ts

permissions:
  contents: read

jobs:
  verify-book:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify manuscript and book assets
        run: npm test

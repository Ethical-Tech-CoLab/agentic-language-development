[package]
name = "ald-integrity-auditor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent read-only cross-check of exported ALD evidence bundles"
publish = false

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.143"
sha2 = "0.10.9"

[lints.clippy]
pedantic = "warn"

